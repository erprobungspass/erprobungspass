name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Typen, Lint, Tests, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lizenzangaben (REUSE)
        uses: fsfe/reuse-action@v5

      - name: REGELWERK.md ist aktuell
        run: |
          npm run regelwerk
          git diff --exit-code -- REGELWERK.md

      - name: Keine Hosting-Abhängigkeit im Lockfile
        run: |
          if grep -qi "lovable" package-lock.json; then
            echo "package-lock.json verweist auf eine Lovable-Quelle." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
